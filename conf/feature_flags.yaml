flags:
  # Embedding model selection
  embedding_model:
    default: "mert_v2"
    variants:
      mert_v2: 0.8
      clmr_v1: 0.2
  
  # Index versions for A/B testing
  index_version:
    default: "ann_v1"
    variants:
      ann_v1: 0.9
      ann_v2: 0.1

  # Ranker model versions  
  ranker_version:
    default: "xgb_v1"
    variants:
      xgb_v1: 0.95
      xgb_v2: 0.05

  # Preview adapter toggle
  preview_adapter_enabled:
    default: false
    rollout_percentage: 0

  # MMR diversity parameter
  mmr_lambda:
    default: 0.7
    variants:
      conservative: 0.5  # More diversity
      balanced: 0.7      # Default
      similar: 0.9       # Less diversity
    weights:
      conservative: 0.2
      balanced: 0.6
      similar: 0.2

  # Flow optimizer
  flow_optimizer_enabled:
    default: false
    rollout_percentage: 10

  # Feature engineering toggles
  features:
    graph_distance_enabled: true
    camelot_distance_enabled: true  
    popularity_penalty_enabled: true
    tempo_matching_enabled: true

  # Explainability
  explanations_enabled:
    default: true
    rollout_percentage: 100

  # Caching
  cache_enabled:
    default: true
    cache_ttl_seconds: 60

  # Rate limiting  
  rate_limiting:
    requests_per_minute: 1000
    burst_allowance: 100

# A/B test configuration
ab_tests:
  recommendation_algorithm:
    variants:
      - name: "cosine_baseline"
        traffic_percentage: 20
        description: "Pure cosine similarity ranking"
      - name: "xgb_ranker" 
        traffic_percentage: 60
        description: "XGBoost learned ranking"
      - name: "neural_ranker"
        traffic_percentage: 20
        description: "Neural ranking model"

  diversity_strategy:
    variants:
      - name: "mmr_only"
        traffic_percentage: 70
        description: "Pure MMR diversity"  
      - name: "mmr_plus_flow"
        traffic_percentage: 30
        description: "MMR + flow optimization"